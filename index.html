<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entropy AI — Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a25;--border:#2a2a3a;--text:#e0e0ec;--muted:#8888a0;--accent:#00ffaa;--accent2:#ff00aa;--warn:#ffaa00;--danger:#ff4444;--radius:12px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;max-width:700px;margin:0 auto}
.header{text-align:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.header h1{font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--muted);font-size:11px;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg);border-radius:16px 4px 16px 16px}
.msg.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:4px 16px 16px 16px}
.msg.ai .reasoning{color:var(--muted);font-size:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-family:'SF Mono',monospace}
.msg.ai .anomaly{color:var(--warn);font-size:12px;display:block;margin-top:4px}
.msg.ai .confidence{color:var(--accent2);font-size:11px;font-family:'SF Mono',monospace}
.msg.system{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.input-area textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:14px;font-family:inherit;resize:none;height:44px;max-height:120px}
.input-area textarea:focus{outline:none;border-color:var(--accent)}
.input-area button{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.input-area button:hover{background:#00ddaa}
.input-area button:disabled{opacity:.5}
.examples{padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border)}
.examples button{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.examples button:hover{color:var(--accent);border-color:var(--accent)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ Entropy AI</h1>
  <p>Information-Theoretic Intelligence · 0 parameters · 0 training · Pure math</p>
</div>

<div class="chat" id="chat">
  <div class="msg system">Entropy AI initialized. 0 parameters loaded. 0 training required. Ready to reason.</div>
</div>

<div class="examples">
  <button onclick="quickSend('What is entropy?')">What is entropy?</button>
  <button onclick="quickSend('Analyze: contract Vulnerable { function withdraw() public { msg.sender.call{value:1 ether}(\"\"); } }')">Analyze code</button>
  <button onclick="quickSend('Is this safe? pragma solidity ^0.8; contract Token { mapping(address=>uint) balances; }')">Is this safe?</button>
  <button onclick="quickSend('Compare these two texts: Hello world vs H3ll0 w0rld')">Compare</button>
  <button onclick="quickSend('Teach: This is English text about machine learning')">Teach</button>
  <button onclick="quickSend('What do you know?')">What do you know?</button>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Ask anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button onclick="send()">Send</button>
</div>

<script>
const DIM_NAMES=["Shannon","NormShannon","Kolmogorov","Permutation","Spectral","MinEntropy","Markov","Wavelet","OpcodeDiv","StorageOps","CallOps","ControlFlow","EntropyRate","CrossContract","Selectors","Repetition","Hurst","Tsallis","Renyi","SampleEntropy","ApproxEntropy","Linguistic","DataDensity","CodeEntropy"];

let memory=[];
let baselines={};

// === ENTROPY ENCODER (24D) ===
function shannon(d){if(!d)return 0;const f={};for(const c of d)f[c]=(f[c]||0)+1;const t=d.length;let h=0;for(const c in f){const p=f[c]/t;h-=p*Math.log2(p)}return h}
function normShannon(d){if(!d)return 0;const s=shannon(d);const u=new Set(d).size;const m=u>1?Math.log2(u):1;return m>0?s/m:0}
function kolmogorov(d){if(!d)return 0;const s=new Set(d);return s.size/d.length}
function permutation(d){if(!d||d.length<4)return 0;const v=[];for(let i=0;i<Math.min(d.length,200);i++)v.push(d.charCodeAt(i));const p={};for(let i=0;i<v.length-3;i++){const w=v.slice(i,i+4);const idx=w.map((x,i)=>[x,i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);const k=idx.join(',');p[k]=(p[k]||0)+1}const t=Object.values(p).reduce((a,b)=>a+b,0);let h=0;for(const k in p){h-=(p[k]/t)*Math.log2(p[k]/t)}return h}
function spectral(d){if(!d||d.length<8)return 0;const v=[];for(let i=0;i<Math.min(d.length,256);i++)v.push(d.charCodeAt(i));const n=Math.min(v.length,32);const psd=[];for(let k=0;k<n;k++){let re=0,im=0;for(let j=0;j<n;j++){re+=v[j]*Math.cos(2*Math.PI*k*j/n);im-=v[j]*Math.sin(2*Math.PI*k*j/n)}psd.push(re*re+im*im)}const t=psd.reduce((a,b)=>a+b,0);if(t===0)return 0;let h=0;for(const p of psd){if(p>0){h-=(p/t)*Math.log2(p/t)}}return h}
function minEntropy(d){if(!d)return 0;const f={};for(const c of d)f[c]=(f[c]||0)+1;const mx=Math.max(...Object.values(f))/d.length;return mx>0?-Math.log2(mx):0}
function markov(d){if(!d||d.length<4)return 0;const t={};let c=0;for(let i=0;i<d.length-2;i++){const k=d[i]+d[i+1];t[k]=(t[k]||0)+1;c++}if(c===0)return 0;let h=0;for(const k in t){h-=(t[k]/c)*Math.log2(t[k]/c)}return h}
function wavelet(d){if(!d||d.length<8)return 0;const v=[];for(let i=0;i<Math.min(d.length,256);i++)v.push(d.charCodeAt(i));let e=0;for(let i=0;i<v.length-1;i+=2){const dt=(v[i]-v[i+1])/2;e+=dt*dt}return Math.log2(e+1)}
function opcodeDiv(h){const s=new Set();for(let i=0;i<h.length-2;i+=2)s.add(h.substr(i,2));return s.size}
function storageOps(h){return(h.match(/54|55/g)||[]).length}
function callOps(h){return(h.match(/f1|fa|f4/g)||[]).length}
function controlFlow(h){return(h.match(/56|57|5b/g)||[]).length}
function entropyRate(d){if(!d||d.length<64)return 0;const w=32;const r=[];for(let i=0;i<d.length-w;i+=w)r.push(shannon(d.substr(i,w)));if(!r.length)return 0;const m=r.reduce((a,b)=>a+b,0)/r.length;let v=0;for(const x of r)v+=(x-m)**2;return Math.sqrt(v/r.length)}
function crossContract(h){const c=(h.match(/f1|f4|fa/g)||[]).length;const d=(h.match(/f4/g)||[]).length;return c>0?d/c:0}
function selectors(h){return(h.match(/63/g)||[]).length}
function repetition(d){if(!d||d.length<10)return 0;const b={};for(let i=0;i<d.length-1;i++){const k=d.substr(i,2);b[k]=(b[k]||0)+1}const t=Object.values(b).reduce((a,b)=>a+b,0);let r=0;for(const k in b)r+=(b[k]/t)**2;return r}
function hurst(d){if(!d||d.length<100)return 0.5;const v=[];for(let i=0;i<Math.min(d.length,200);i++)v.push(d.charCodeAt(i));const n=v.length;const m=v.reduce((a,b)=>a+b,0)/n;const dev=v.map(x=>x-m);const cum=[];let s=0;for(const x of dev){s+=x;cum.push(s)}const R=Math.max(...cum)-Math.min(...cum);const sd=Math.sqrt(dev.reduce((a,b)=>a+b*b,0)/n);return(sd>0&&R>0)?Math.log(R/sd)/Math.log(n):0.5}
function tsallis(d,q=2){if(!d)return 0;const f={};for(const c of d)f[c]=(f[c]||0)+1;const t=d.length;let s=0;for(const k in f){s+=Math.pow(f[k]/t,q)}return(1-s)/(q-1)}
function renyi(d,a=2){if(!d)return 0;const f={};for(const c of d)f[c]=(f[c]||0)+1;const t=d.length;let s=0;for(const k in f){s+=Math.pow(f[k]/t,a)}return 1/(1-a)*Math.log2(s+1e-10)}
function sampleEntropy(d,m=2,r=0.2){if(!d||d.length<m+1)return 0;const v=[];for(let i=0;i<Math.min(d.length,200);i++)v.push(d.charCodeAt(i));const mn=v.reduce((a,b)=>a+b,0)/v.length;const vr=v.reduce((a,b)=>a+(b-mn)**2,0)/v.length;const rv=r*Math.sqrt(vr)||1;function cnt(mv){const ps=[];for(let i=0;i<v.length-mv;i++)ps.push(v.slice(i,i+mv));let c=0;for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){let ok=true;for(let k=0;k<mv;k++)if(Math.abs(ps[i][k]-ps[j][k])>rv){ok=false;break}if(ok)c++}return c}const A=cnt(m+1),B=cnt(m);return B>0?-Math.log(A/B+1e-10):0}
function approxEntropy(d,m=2,r=0.2){if(!d||d.length<m+2)return 0;const v=[];for(let i=0;i<Math.min(d.length,200);i++)v.push(d.charCodeAt(i));const mn=v.reduce((a,b)=>a+b,0)/v.length;const vr=v.reduce((a,b)=>a+(b-mn)**2,0)/v.length;const rv=r*Math.sqrt(vr)||1;function phi(mv){const ps=[];for(let i=0;i<v.length-mv;i++)ps.push(v.slice(i,i+mv));let s=0;for(const p of ps){let c=0;for(const q of ps){let ok=true;for(let k=0;k<mv;k++)if(Math.abs(p[k]-q[k])>rv){ok=false;break}if(ok)c++}s+=Math.log(c/ps.length+1e-10)}return s/ps.length}return phi(m)-phi(m+1)}
function linguistic(d){return d?new Set(d).size/d.length:0}
function dataDensity(h){if(!h)return 0;let nz=0;for(const c of h)if(c!=='0')nz++;return nz/h.length}
function codeEntropy(h){if(!h||h.length<100)return 0;const ch=[];for(let i=0;i<h.length;i+=100)ch.push(h.substr(i,100));const es=ch.filter(c=>c.length>10).map(c=>shannon(c));if(!es.length)return 0;const m=es.reduce((a,b)=>a+b,0)/es.length;const v=es.reduce((a,b)=>a+(b-m)**2,0)/es.length;return Math.sqrt(v)}

function encode(data){
  const raw=typeof data==='string'?data:String(data);
  let hexd=raw;
  if(!/^[0-9a-f]*$/i.test(raw.substr(0,100))){hexd='';for(let i=0;i<Math.min(raw.length,4000);i++)hexd+=raw.charCodeAt(i).toString(16).padStart(2,'0')}
  return[shannon(raw.substr(0,4000)),normShannon(raw.substr(0,4000)),kolmogorov(raw.substr(0,4000)),permutation(raw.substr(0,2000)),spectral(raw.substr(0,2000)),minEntropy(raw.substr(0,4000)),markov(raw.substr(0,4000)),wavelet(raw.substr(0,2000)),opcodeDiv(hexd),storageOps(hexd),callOps(hexd),controlFlow(hexd),entropyRate(raw.substr(0,4000)),crossContract(hexd),selectors(hexd),repetition(raw.substr(0,4000)),hurst(raw.substr(0,2000)),tsallis(raw.substr(0,4000)),renyi(raw.substr(0,4000)),sampleEntropy(raw.substr(0,2000)),approxEntropy(raw.substr(0,2000)),linguistic(raw.substr(0,4000)),dataDensity(hexd),codeEntropy(hexd)]
}

function cosineSim(a,b){let d=0,n1=0,n2=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];n1+=a[i]*a[i];n2+=b[i]*b[i]}n1=Math.sqrt(n1);n2=Math.sqrt(n2);return(n1>0&&n2>0)?d/(n1*n2):0}
function klDiv(a,b){let s=0;for(let i=0;i<a.length;i++){const p=a[i]+1e-10,q=b[i]+1e-10;s+=p*Math.log2(p/q)}return s}

function detectAnomalies(v){const a=[];if(v[2]>0.9)a.push("high_complexity — difficult to compress, high algorithmic complexity");if(v[0]<2.0&&v[15]>0.1)a.push("high_redundancy — repetitive structure, low information density");if(v[12]>0.5)a.push("non_uniform_entropy — entropy varies significantly across segments");if(v[9]>10)a.push("stateful — heavy storage operations, state management pattern");if(v[10]>5&&v[13]>0.3)a.push("proxy_pattern — high external calls with delegatecall ratio");if(v[16]>0.6)a.push("persistent — long-range correlations, trending behavior");if(v[16]<0.4&&v[16]>0)a.push("mean_reverting — anti-persistent, tends to reverse");return a}

// === REASONING ENGINE ===
// This is the core "intelligence" — it reasons about input using entropy math
function reason(input){
  const v=encode(input);
  const anomalies=detectAnomalies(v);
  const total=v.reduce((a,b)=>a+b,0);
  const complexity=total/24;
  const maxIdx=v.indexOf(Math.max(...v));
  const minIdx=v.indexOf(Math.min(...v.filter(x=>x>=0)));
  
  // Detect input type using entropy heuristics (no training needed)
  let type='unknown';
  let typeConfidence=0;
  const lower=input.toLowerCase();
  
  // Entropy-based type detection
  if(v[8]>10&&v[10]>2){type='evm_bytecode';typeConfidence=0.95}
  else if(/contract\s+\w+/.test(lower)&&/function|mapping|pragma|payable/.test(lower)){type='solidity_code';typeConfidence=0.93}
  else if(/^def |^import |^class |=>\s|print\(/.test(lower)){type='python_code';typeConfidence=0.90}
  else if(/select|drop|insert|union|or\s+1=1|--/.test(lower)&&v[0]<4){type='sql_injection';typeConfidence=0.88}
  else if(v[22]>0.8&&v[21]>0.4&&v[0]>3.5){type='natural_language';typeConfidence=0.92}
  else if(v[0]>5&&v[15]<0.05){type='random_noise';typeConfidence=0.85}
  else if(/\{.*:.*\}/.test(input)||/"type"|"amount"|"token"/.test(lower)){type='json_data';typeConfidence=0.80}
  else{type='structured_data';typeConfidence=0.60}
  
  // Check against learned baselines
  let learnedMatch=null;
  if(Object.keys(baselines).length>0){
    let bestSim=-1,bestLabel='unknown';
    for(const[label,baseline]of Object.entries(baselines)){
      const sim=cosineSim(v,baseline);
      if(sim>bestSim){bestSim=sim;bestLabel=label}
    }
    if(bestSim>0.7){learnedMatch={label:bestLabel,sim:bestSim}}
  }
  
  // Detect if it's a question
  const isQuestion=/^\s*(what|how|why|is|are|can|do|does|which|when|where|who|tell|explain|analyze|compare|check|teach|learn)/i.test(input.trim());
  
  // Detect if it wants to teach
  const isTeach=/^teach:|^learn:|^remember:/i.test(input.trim());
  
  // Detect comparison
  const isCompare=/^compare/i.test(input.trim())||/\svs\s|\sversus\s/i.test(input);
  
  return{v,anomalies,type,typeConfidence,complexity,total,maxDim:DIM_NAMES[maxIdx],minDim:DIM_NAMES[minIdx],learnedMatch,isQuestion,isTeach,isCompare,maxIdx,minIdx};
}

// === RESPONSE GENERATOR ===
// Composes natural-language-like responses from entropy reasoning
function generateResponse(input){
  const r=reason(input);
  
  // Handle teaching
  if(r.isTeach){
    const parts=input.split(/[:\n]/);
    const label=parts[1]?parts[1].trim().split(/[, ]/)[0]:'concept_'+memory.length;
    const data=parts.slice(1).join(':').trim();
    const v=encode(data);
    memory.push({vector:v,label,preview:data.substr(0,80)});
    if(!baselines[label])baselines[label]=[...v];
    else{const c=memory.filter(m=>m.label===label).length;for(let i=0;i<24;i++)baselines[label][i]=(baselines[label][i]*(c-1)+v[i])/c}
    return{
      text:`Learned "${label}" from a single example. I now have ${memory.length} entropy signatures across ${Object.keys(baselines).length} concepts.`,
      reasoning:`Stored entropy profile: Shannon=${r.v[0].toFixed(2)}, Kolmogorov=${r.v[2].toFixed(2)}, Complexity=${r.complexity.toFixed(3)}`,
      confidence:1.0
    }
  }
  
  // Handle comparison
  if(r.isCompare){
    const parts=input.replace(/^compare/i,'').split(/\svs\s|\sversus\s/i);
    if(parts.length>=2){
      const a=encode(parts[0].trim());
      const b=encode(parts[1].trim());
      const sim=cosineSim(a,b);
      const dist=klDiv(a,b);
      let verdict='';
      if(sim>0.99)verdict='These inputs have nearly identical entropy DNA — they are structurally the same.';
      else if(sim>0.95)verdict='Very similar entropy profiles with minor structural differences.';
      else if(sim>0.8)verdict='Notable structural overlap, but they are distinct inputs.';
      else if(sim>0.5)verdict='Some shared characteristics, but fundamentally different entropy signatures.';
      else verdict='Completely different entropy signatures — these inputs share almost nothing structurally.';
      return{
        text:`${verdict}\n\nCosine similarity: ${(sim*100).toFixed(1)}%\nKL divergence: ${dist.toFixed(4)}\nEntropy distance: ${(klDiv(b,a)+dist/2).toFixed(4)}`,
        reasoning:`A: Shannon=${a[0].toFixed(2)}, B: Shannon=${b[0].toFixed(2)} | A: Kolmogorov=${a[2].toFixed(2)}, B: Kolmogorov=${b[2].toFixed(2)}`,
        confidence:sim
      }
    }
  }
  
  // Handle "What do you know?"
  if(/what do you know|what have you learned|show memory|list/i.test(input)&&memory.length>0){
    const concepts=Object.entries(baselines).map(([label,v])=>`• ${label}`).join('\n');
    return{
      text:`I have ${memory.length} entropy signatures across ${Object.keys(baselines).length} concepts:\n\n${concepts}\n\nEach concept is stored as a 24D entropy profile. I can classify new inputs by matching their entropy DNA against these baselines.`,
      reasoning:'Memory recall — no parameters, no training, just entropy signature matching.',
      confidence:1.0
    }
  }
  
  // Handle "What is entropy?"
  if(/what is entropy/i.test(input)){
    return{
      text:`Entropy is the fundamental measure of information content, defined by Claude Shannon in 1948.\n\nH(X) = -Σ p(x) log₂ p(x)\n\nIn simple terms: entropy measures how much "surprise" or "uncertainty" exists in data. A coin flip has 1 bit of entropy. A die roll has ~2.58 bits. Random noise has maximum entropy. A repeating pattern has near-zero entropy.\n\nI use 24 dimensions of entropy to understand any input — not by reading its content, but by measuring its mathematical DNA.`,
      reasoning:'Intrinsic knowledge — entropy is the foundation of information theory.',
      confidence:1.0
    }
  }
  
  // Handle code analysis
  if(r.type==='solidity_code'||r.type==='sql_injection'){
    let analysis='';
    if(r.type==='sql_injection'){
      analysis='⚠️ This input matches the entropy signature of SQL injection attacks. The entropy profile shows high complexity with low repetition — a hallmark of obfuscated malicious payloads.';
    }else if(r.anomalies.includes('proxy_pattern')){
      analysis='This contract shows proxy patterns with high delegatecall usage. This is common in upgradeable contracts but introduces significant risk if the implementation address can be changed.';
    }else if(r.anomalies.includes('stateful')){
      analysis='This contract has heavy storage operations, indicating it manages significant on-chain state. The entropy profile suggests a complex state machine.';
    }else if(r.v[10]>3&&r.v[0]<3.5){
      analysis='This contract has high external call entropy. Combined with moderate Shannon entropy, this suggests interaction with external contracts — potential reentrancy surface.';
    }else if(r.v[9]<2&&r.v[10]<2){
      analysis='This contract has low storage and call entropy. The entropy profile suggests a simple, stateless contract — likely lower risk.';
    }else{
      analysis=`This contract has a ${r.complexity>0.5?'complex':'moderate'} entropy profile. Shannon entropy is ${r.v[0].toFixed(2)} bits, Kolmogorov complexity is ${r.v[2].toFixed(2)}, and the dominant dimension is ${r.maxDim}.`;
    }
    
    let vulnCheck='';
    if(r.v[10]>5&&r.v[13]>0.3)vulnCheck+='\n⚠️ Delegatecall pattern detected — potential proxy vulnerability.';
    if(r.v[9]>10)vulnCheck+='\n⚠️ Heavy storage usage — potential state manipulation surface.';
    if(r.v[12]>0.5)vulnCheck+='\n⚠️ Non-uniform entropy distribution — contract may behave differently in different code paths.';
    if(r.v[16]<0.4&&r.v[16]>0)vulnCheck+='\n⚠️ Mean-reverting entropy — contract may have anti-patterns that repeat.';
    
    let learnedInfo='';
    if(r.learnedMatch){
      learnedInfo=`\n\nThis matches my learned concept "${r.learnedMatch.label}" with ${(r.learnedMatch.sim*100).toFixed(1)}% confidence.`;
    }
    
    return{
      text:`${analysis}${vulnCheck}${learnedInfo}\n\nType: ${r.type} (${(r.typeConfidence*100).toFixed(0)}%)\nComplexity: ${r.complexity.toFixed(3)}\nTotal entropy: ${r.total.toFixed(2)}`,
      reasoning:`Entropy reasoning: Shannon=${r.v[0].toFixed(2)}, Kolmogorov=${r.v[2].toFixed(2)}, Markov=${r.v[6].toFixed(2)}, Hurst=${r.v[16].toFixed(3)}`,
      confidence:r.typeConfidence
    }
  }
  
  // Handle natural language
  if(r.type==='natural_language'){
    let response='';
    if(r.isQuestion){
      // Check if we have learned anything about this topic
      if(r.learnedMatch){
        response=`I detect this is a question about "${r.learnedMatch.label}". Based on my entropy memory, this topic has a complexity score of ${r.complexity.toFixed(3)} and matches with ${(r.learnedMatch.sim*100).toFixed(1)}% confidence.\n\nMy entropy analysis shows: Shannon=${r.v[0].toFixed(2)} bits (information content), Kolmogorov=${r.v[2].toFixed(2)} (compressibility), and Hurst=${r.v[16].toFixed(3)} (long-range patterns).`;
      }else{
        response=`I understand this as a question in natural language. My entropy analysis reveals:\n\n• Information content: ${r.v[0].toFixed(2)} bits/char\n• Compressibility: ${(r.v[2]*100).toFixed(0)}%\n• Vocabulary diversity: ${(r.v[21]*100).toFixed(0)}%\n• Complexity: ${r.complexity.toFixed(3)}\n\nI don't have a learned concept matching this query yet. You can teach me by typing "Teach: [label]" followed by an example.`;
      }
    }else{
      response=`I've analyzed your message. It has the entropy signature of ${r.type} with ${(r.typeConfidence*100).toFixed(0)}% confidence.\n\nInformation content: ${r.v[0].toFixed(2)} bits\nComplexity: ${r.complexity.toFixed(3)}\nMost prominent dimension: ${r.maxDim}`;
    }
    if(r.anomalies.length>0){
      response+='\n\nEntropy anomalies detected:\n'+r.anomalies.map(a=>'⚠️ '+a).join('\n');
    }
    return{text:response,reasoning:`Type detection via entropy heuristics — no neural network, pure math.`,confidence:r.typeConfidence}
  }
  
  // Handle bytecode
  if(r.type==='evm_bytecode'){
    return{
      text:`I've analyzed this EVM bytecode using 24D entropy extraction.\n\n• Opcode diversity: ${r.v[8]}\n• Storage operations: ${r.v[9]}\n• Call operations: ${r.v[10]}\n• Control flow ops: ${r.v[11]}\n• Cross-contract ratio: ${(r.v[13]*100).toFixed(1)}%\n• Function selectors: ${r.v[14]}\n\nThis bytecode has ${r.v[10]>5?'high':'moderate'} external call entropy and ${r.v[9]>10?'heavy':'moderate'} state usage.${r.anomalies.length?'\n\nAnomalies:\n'+r.anomalies.map(a=>'⚠️ '+a).join('\n'):''}`,
      reasoning:`Bytecode entropy analysis — 24 dimensions computed in real-time, no training data.`,
      confidence:r.typeConfidence
    }
  }
  
  // Handle random/noise
  if(r.type==='random_noise'){
    return{
      text:`This input has the entropy signature of random data. High Shannon entropy (${r.v[0].toFixed(2)}) with low repetition (${r.v[15].toFixed(4)}) suggests this is either noise, encrypted data, or a hash.\n\nI cannot extract meaningful patterns from pure randomness — and that IS the correct answer. Entropy analysis confirms: no information structure detected.`,
      reasoning:`Maximum entropy = minimum structure. This is mathematically the "least interesting" input — and that's a valid conclusion.`,
      confidence:r.typeConfidence
    }
  }
  
  // Handle JSON/structured data
  if(r.type==='json_data'||r.type==='structured_data'){
    return{
      text:`I've analyzed this structured data. Its entropy profile shows:\n\n• Information content: ${r.v[0].toFixed(2)} bits\n• Complexity: ${r.complexity.toFixed(3)}\n• Data density: ${(r.v[22]*100).toFixed(0)}%\n• Structure variance: ${r.v[23].toFixed(3)}\n\nType: ${r.type} (${(r.typeConfidence*100).toFixed(0)}% confidence)${r.anomalies.length?'\n\nAnomalies:\n'+r.anomalies.map(a=>'⚠️ '+a).join('\n'):''}`,
      reasoning:`Structured data entropy analysis — detecting patterns without parsing content.`,
      confidence:r.typeConfidence
    }
  }
  
  // Default response
  return{
    text:`I've processed your input through 24 dimensions of entropy analysis.\n\nDetected type: ${r.type} (${(r.typeConfidence*100).toFixed(0)}% confidence)\nComplexity: ${r.complexity.toFixed(3)}\nTotal entropy: ${r.total.toFixed(2)}\nDominant dimension: ${r.maxDim}${r.anomalies.length?'\n\nAnomalies:\n'+r.anomalies.map(a=>'⚠️ '+a).join('\n'):''}${r.learnedMatch?'\n\nLearned match: '+r.learnedMatch.label+' ('+(r.learnedMatch.sim*100).toFixed(1)+'%)':''}`,
    reasoning:`24D entropy extraction + information-theoretic reasoning. Zero parameters. Zero training.`,
    confidence:r.typeConfidence
  }
}

// === CHAT INTERFACE ===
function addMsg(text,sender,reasoning,confidence){
  const chat=document.getElementById('chat');
  const div=document.createElement('div');
  div.className='msg '+sender;
  if(sender==='ai'){
    let html=text.replace(/\n/g,'<br>');
    if(reasoning){html+=`<div class="reasoning">⚙️ ${reasoning}</div>`}
    if(confidence!==undefined){html+=`<div class="confidence">confidence: ${(confidence*100).toFixed(1)}%</div>`}
    div.innerHTML=html;
  }else{
    div.textContent=text;
  }
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  addMsg(text,'user');
  
  // Show "thinking" indicator
  const chat=document.getElementById('chat');
  const thinking=document.createElement('div');
  thinking.className='msg system';
  thinking.textContent='Reasoning...';
  thinking.id='thinking';
  chat.appendChild(thinking);
  chat.scrollTop=chat.scrollHeight;
  
  // Process after short delay (feels like thinking)
  setTimeout(()=>{
    document.getElementById('thinking')?.remove();
    const response=generateResponse(text);
    addMsg(response.text,'ai',response.reasoning,response.confidence);
  },400);
}

function quickSend(text){
  document.getElementById('input').value=text;
  send();
}
</script>
